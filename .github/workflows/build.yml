name: Build BlockDropAddon JAR

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build addon
        run: ./gradlew :BlockDropAddon:build

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: easy-mob-farm-block-drop-addon
          path: BlockDropAddon/build/libs/*.jar
          if-no-files-found: error
