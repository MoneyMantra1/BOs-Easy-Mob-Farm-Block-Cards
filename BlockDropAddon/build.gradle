plugins {
  id 'maven-publish'
  id 'net.neoforged.gradle.userdev'
}

base {
  archivesName = "easy-mob-farm-block-drop-addon-neoforge-${minecraft_version}"
}

runs {
  configureEach {
    systemProperty 'forge.logging.markers', 'REGISTRIES'
    systemProperty 'forge.logging.console.level', 'debug'
    modSource project.sourceSets.main
  }

  client {
    workingDirectory project.file('runs/client')
  }

  server {
    workingDirectory project.file('runs/server')
    programArgument '--nogui'
  }
}

dependencies {
  implementation "net.neoforged:neoforge:${project.neoforge_version}"
  compileOnly project(':NeoForge')
  runtimeOnly project(':NeoForge')
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifactId = base.archivesName.get()
      from components.java
    }
  }
}
